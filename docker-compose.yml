services:
  postgres_db:
    image: postgres:16-alpine
    container_name: murray-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_password_seguro}
      POSTGRES_DB: ${POSTGRES_DB:-n8n_database}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n_admin} -d ${POSTGRES_DB:-n8n_database}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - agent-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: murray-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - agent-net

  n8n:
    image: n8nio/n8n:latest
    container_name: murray-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres_db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n_database}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n_admin}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-cambiar_password_seguro}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=https://${SUBDOMINIO_PUBLICO}/
      - N8N_WEBHOOK_URL=https://${SUBDOMINIO_PUBLICO}/
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=UTC
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/opt/workflows:ro
    depends_on:
      postgres_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - agent-net

  workspace-mcp:
    image: node:20-alpine
    container_name: murray-workspace-mcp
    restart: unless-stopped
    working_dir: /tmp
    command: ["node", "/opt/mcp/server.mjs"]
    environment:
      - GMAIL_ALLOW_SENDING=false
      - GMAIL_ALLOW_DRAFTS=true
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
      - MCP_HTTP_PORT=8000
    volumes:
      - ./config/workspace-mcp:/opt/mcp:ro
      - ./config/mcp-auth:/app/auth
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - agent-net

  litellm:
    # Pin publicado 2026-09-02. Health de este tag: GET /health/liveliness (no /health).
    image: ghcr.io/berriai/litellm:v1.99.1
    container_name: murray-litellm
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      # PERMISSIVE (roadmap/91): el sandbox oh-agent-server vive en bridge y no resuelve `litellm`.
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - agent-net

  murray-agent:
    build: ./config/murray-agent
    image: murray-agent:local
    container_name: murray-agent
    restart: unless-stopped
    working_dir: /tmp
    command: ["node", "/opt/agent/server.mjs"]
    security_opt:
      - "no-new-privileges:true"
    environment:
      - LITELLM_BASE_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      - DEEPSEEK_MODEL=deepseek-chat
      - MURRAY_AGENT_PORT=8080
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-murray-infra}
      - COMPOSE_FILE=/opt/stack/docker-compose.yml
      - COMPOSE_PROJECT_DIR=/opt/stack
      - GMAIL_MCP_URL=http://workspace-mcp:8000
      - N8N_HEALTH_URL=http://n8n:5678/healthz
      - OPENHANDS_HEALTH_URL=http://openhands:3000/health
      - OPENHANDS_URL=http://openhands:3000
      - MURRAY_DB_PATH=/var/lib/murray-agent/murray.db
      - MURRAY_MEMORY_PATH=/var/lib/murray-agent/memory.json
      - MURRAY_SESSION_PATH=/var/lib/murray-agent/session.json
      - MURRAY_JOBS_PATH=/var/lib/murray-agent/jobs.json
      - MURRAY_WORKSPACE_ROOT=/opt/workspace
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - MURRAY_HITL_BYPASS=${MURRAY_HITL_BYPASS:-code,clone}
      - MURRAY_TELEGRAM_QUIET=${MURRAY_TELEGRAM_QUIET:-1}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - MURRAY_GIT_NAME=${MURRAY_GIT_NAME:-}
      - MURRAY_GIT_EMAIL=${MURRAY_GIT_EMAIL:-}
      - MURRAY_OPERATOR_INBOX=/opt/operator-inbox
    volumes:
      - ./config/murray-agent:/opt/agent:ro
      - ./docker-compose.yml:/opt/stack/docker-compose.yml:ro
      - ./.env:/opt/stack/.env:ro
      - ./workspace:/opt/workspace
      - ./RUNBOOK.md:/opt/docs/RUNBOOK.md:ro
      - ./architecture_spec.md:/opt/docs/architecture_spec.md:ro
      - ./.agents/skills/dev-protocol/lessons-learned.md:/opt/docs/lessons-learned.md:ro
      - ./CHANGELOG.md:/opt/docs/CHANGELOG.md:ro
      - ./CONTEXT.md:/opt/docs/CONTEXT.md:ro
      - ./roadmap/91_PERMISSIVE_WINDOW.md:/opt/docs/permissive.md:ro
      - ./operator-inbox:/opt/operator-inbox
      - /var/run/docker.sock:/var/run/docker.sock
      - murray_agent_data:/var/lib/murray-agent
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 8s
    networks:
      - agent-net

  openhands:
    image: ghcr.io/openhands/openhands:latest
    container_name: murray-openhands
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENHANDS_PORT:-3000}:3000"
    security_opt:
      - "no-new-privileges:true"
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=ghcr.io/openhands/runtime:latest
      # PERMISSIVE (roadmap/91): path absoluto. `./workspace` deja el sandbox SIN mounts.
      - WORKSPACE_MOUNT_PATH=${WORKSPACE_HOST_PATH:-${PWD}/workspace}
      - SANDBOX_VOLUMES=${WORKSPACE_HOST_PATH:-${PWD}/workspace}:/workspace/project:rw
      - LLM_MODEL=openai/garfio-worker
      # PERMISSIVE (roadmap/91): oh-agent-server no resuelve DNS `litellm`. Loopback vía Desktop.
      - LLM_BASE_URL=http://host.docker.internal:${LITELLM_PORT:-4000}
      - LLM_API_KEY=${LITELLM_MASTER_KEY:-}
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY:-}
      - OPENAI_BASE_URL=http://host.docker.internal:${LITELLM_PORT:-4000}
      # OpenHands 1.36 solo reenvía LLM_* al sandbox. openai/ exige OPENAI_API_KEY ahí.
      - OH_AGENT_SERVER_ENV={"OPENAI_API_KEY":"${LITELLM_MASTER_KEY:-}","OPENAI_BASE_URL":"http://host.docker.internal:${LITELLM_PORT:-4000}","LITELLM_PROXY_API_KEY":"${LITELLM_MASTER_KEY:-}"}
      - SANDBOX_ENV_OPENAI_API_KEY=${LITELLM_MASTER_KEY:-}
      - SANDBOX_ENV_OPENAI_BASE_URL=http://host.docker.internal:${LITELLM_PORT:-4000}
      - SANDBOX_ENV_LLM_API_KEY=${LITELLM_MASTER_KEY:-}
      - SANDBOX_ENV_LLM_BASE_URL=http://host.docker.internal:${LITELLM_PORT:-4000}
      - LOG_LEVEL=INFO
      - MAX_ITERATIONS=80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspace:/opt/workspace_base
      - ~/.openhands-state:/.openhands-state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local
  murray_agent_data:
    driver: local
